version: '3.8'
services:
  app:
    build:
      context: .
    # Remova ou comente a linha de ports se não precisar acessar diretamente do host
    # - "127.0.0.1:3001:3001" # Não é necessário para o Traefik, ele usa a rede interna

    # --- LABELS DO TRAEFIK ---
    labels:
      # Habilita o Traefik para este serviço
      - "traefik.enable=true"
      # Define o nome do roteador no Traefik
      - "traefik.http.routers.que-peixe-e-esse-app.rule=Host(`que-peixe-e-esse.com`)"
      # Redireciona HTTP para HTTPS (se você tiver um roteador HTTP separado no Traefik)
      - "traefik.http.routers.que-peixe-e-esse-app.entrypoints=websecure" # Usa o entrypoint HTTPS
      - "traefik.http.routers.que-peixe-e-esse-app.tls.certresolver=lets-encrypt" # Usa o Let's Encrypt para TLS
      # Define o serviço interno para o Traefik (o nome do contêiner e a porta)
      - "traefik.http.services.que-peixe-e-esse-app.loadbalancer.server.port=3001"
      # Opcional: Para usar middleware de redirecionamento HTTP para HTTPS, se necessário
      # - "traefik.http.routers.que-peixe-e-esse-app.middlewares=redirect-to-https@docker"
    # --- FIM DAS LABELS DO TRAEFIK ---

    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: 'db'
      DB_PORT: '${DB_PORT:-5432}'
      DB_NAME: '${DB_NAME:-que-peixe-e-esse-db}'
      DB_USER: '${DB_USER:-admin}'
      DB_PASSWORD: '${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}'
      JWT_SECRET: '${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}'
      MERCADO_PAGO_ACCESS_TOKEN: '${MERCADO_PAGO_ACCESS_TOKEN:-}'
      MERCADO_PAGO_WEBHOOK_SECRET: '${MERCADO_PAGO_WEBHOOK_SECRET:-}'
      MERCADO_PAGO_BACK_URL: '${MERCADO_PAGO_BACK_URL:-https://que-peixe-e-esse.com}'
      PUTER_AUTH_TOKEN: '${PUTER_AUTH_TOKEN:-}'
      FISH_SEARCH_URL: '${FISH_SEARCH_URL:-http://searxng:8080}'
    restart: unless-stopped
    depends_on:
      - db

  db: # <--- ADICIONE ESTE NOVO SERVIÇO PARA O POSTGRESQL
    image: postgres:17-alpine # Usar a mesma imagem que você já tem rodando
    restart: always
    environment:
      POSTGRES_DB: '${DB_NAME:-que-peixe-e-esse-db}' # <--- Use a mesma variável de nome de DB
      POSTGRES_USER: '${DB_USER:-admin}' # <--- Use a mesma variável de usuário
      POSTGRES_PASSWORD: '${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}' # <--- Use a mesma variável de senha
    volumes:
      - db_data:/var/lib/postgresql/data # <--- Adicionar um volume para persistência dos dados
    ports:
      - "5432:5432" # OPCIONAL: Mapeie se precisar acessar o DB do host. Para comunicação interna, não é necessário.

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: '${SEARXNG_BASE_URL:-http://localhost:8080/}'
      SEARXNG_SECRET: '${SEARXNG_SECRET:?Configure SEARXNG_SECRET no arquivo .env}'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  searxng-cache:
  db_data: # <--- Adicione este volume para o banco de dados