services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-que-peixe-e-esse-db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-132097-.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:- 132097 -.env}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-string-of-at-least-32-characters}
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.meu-site.rule=Host(`${SITE_DOMAIN:?Configure SITE_DOMAIN no arquivo .env}`) || Host(`www.${SITE_DOMAIN:?Configure SITE_DOMAIN no arquivo .env}`)'
      - traefik.http.routers.meu-site.entrypoints=websecure
      - traefik.http.routers.meu-site.tls=true
      - traefik.http.routers.meu-site.tls.certresolver=letsencrypt
      - traefik.http.routers.meu-site.tls.domains[0].main=${SITE_DOMAIN:?Configure SITE_DOMAIN no arquivo .env}
      - traefik.http.routers.meu-site.tls.domains[0].sans=www.${SITE_DOMAIN:?Configure SITE_DOMAIN no arquivo .env}
      - traefik.http.routers.meu-site.service=meu-site
      - traefik.http.services.meu-site.loadbalancer.server.port=3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
